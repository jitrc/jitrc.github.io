---
layout: page
---
<article class="nutshell-note">
    <h1 class="title">{{ page.title }}</h1>

    <p class="nutshell-meta">
        {% include post-dates.html %}
        {% if page.applies_to %}<span class="nutshell-applies">{{ page.applies_to }}</span>{% endif %}
        {% for tag in page.tags %}<span class="nutshell-tag">{{ tag }}</span>{% endfor %}
    </p>

    {% if page.summary %}<p class="nutshell-summary">{{ page.summary }}</p>{% endif %}

    {{ content }}

    {% include share.html %}

    <p class="nutshell-back"><a href="{{ "/nutshell/" | relative_url }}">&larr; All Nutshell notes</a></p>
</article>
