{%- assign share_url = page.url | absolute_url -%}
{%- assign share_title = page.title | default: site.name -%}
<div class="share">
    <span class="share-label">Share</span>

    <button class="share-btn" type="button" data-share-copy="{{ share_url }}">
        <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a5 5 0 0 0 7.1 0l2.8-2.8a5 5 0 0 0-7.1-7.1l-1.4 1.4"/><path d="M13.4 10.6a5 5 0 0 0-7.1 0l-2.8 2.8a5 5 0 0 0 7.1 7.1l1.4-1.4"/></svg>
        <span class="share-text">Copy link</span>
    </button>

    <a class="share-btn" href="mailto:?subject={{ share_title | uri_escape }}&amp;body={{ share_url | uri_escape }}">
        <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Email</span>
    </a>

    <a class="share-btn share-btn--icon" href="https://x.com/intent/post?url={{ share_url | uri_escape }}{% if site.twitter %}&amp;via={{ site.twitter }}{% endif %}" target="_blank" rel="noopener" aria-label="Share on X" title="Share on X">
        <svg class="share-icon share-icon--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>

    <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | uri_escape }}" target="_blank" rel="noopener">
        <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        <span>LinkedIn</span>
    </a>

    <a class="share-btn" href="https://news.ycombinator.com/submitlink?u={{ share_url | uri_escape }}&amp;t={{ share_title | uri_escape }}" target="_blank" rel="noopener">
        <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        <span>Hacker News</span>
    </a>
</div>

<script>
(function () {
    var btn = document.querySelector('[data-share-copy]');
    if (!btn) return;
    var label = btn.querySelector('.share-text');
    var rest = label.textContent;

    function flash(text) {
        label.textContent = text;
        btn.classList.add('is-copied');
        window.setTimeout(function () {
            label.textContent = rest;
            btn.classList.remove('is-copied');
        }, 1800);
    }

    btn.addEventListener('click', function () {
        var url = btn.getAttribute('data-share-copy');
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(function () {
                flash('Copied');
            }, function () {
                flash('Copy failed');
            });
            return;
        }
        var field = document.createElement('textarea');
        field.value = url;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(field);
        flash(ok ? 'Copied' : 'Copy failed');
    });
})();
</script>
