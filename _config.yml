width: normal

# if you don't need pagination, comment the *paginate* configs below
# paginate: 5
# paginate_path: "blog/:num/"

# set to true to show Moments gallery in nav
moments: true

# if you don't need "about" or "blog", comment them out below
about: false
blog: false

# do you want to show the "read time" of the posts?
read-time: false

# do you want to show the "tags" inside the posts?
show-tags: false

# related posts inside a post?
related: true

# Display links for next and previous posts for the specified categories
post-advance-links: [blog]

# show author block at the end of a post ?
show-author: true

# do you want some animations?
animation: true

plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-sitemap

jekyll-mentions:
    base_url: https://github.com

# "Nutshell" — short technical explainers with diagrams.
# Notes live in _nutshell/*.md and render at /nutshell/<slug>/.
# The flag cannot be called `nutshell`: a collection with that label shadows
# `site.nutshell` (it becomes the document array), so the nav check would fail.
show_nutshell: true

# Talk: the rendered Marp deck at /age_of_gen_ai/ (source files are excluded below).
show_age_of_gen_ai: true

# Files that are repo housekeeping, not site content. Jekyll copies anything
# unmatched to the web root, so without this README/AGENTS/scripts are public.
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - package.json
  - package-lock.json
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - age_of_gen_ai/*.md
  - age_of_gen_ai/video_script.json

collections:
    nutshell:
        output: true
        permalink: /nutshell/:name/
